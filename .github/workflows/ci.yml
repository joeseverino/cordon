# cordon rides its own reusable gate, like every repo in the fleet, so its check
# lines up too: `cordon / gate`. A local ref (./…) runs this branch's workflow,
# and `cordon-ref` points the engine at this branch's commit, so a pull request
# is gated by the workflow and the checks it actually ships.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cordon:
    uses: ./.github/workflows/cordon-gate.yml
    with:
      cordon-ref: ${{ github.event.pull_request.head.sha || github.sha }}
