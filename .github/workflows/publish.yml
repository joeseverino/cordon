name: publish

# Publish on GitHub Release (release-please): cordon-spec to npm and
# cordon-emit to PyPI, both via Trusted Publishing (OIDC) — no tokens.
# GOTCHA: release-please creates the Release with the workflow GITHUB_TOKEN,
# and token-created events do NOT trigger other workflows (recursion guard) —
# so the release event below only fires for human-created releases. Until the
# publish jobs fold into the release workflow itself, run this manually after
# a release lands:  gh workflow run publish.yml
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Publish cordon-spec to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm publish

  pypi:
    name: Publish cordon-emit to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist + wheel
        run: uv build
        working-directory: emitters/python
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: emitters/python/dist
